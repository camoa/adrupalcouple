                          value: '<h2>Short Bio</h2><p>She is a sweet Web designer who challenged herself to learn code and succeed. Despite of coming from an art and design world, she has been always interested in web development and best practices. She quickly learned Drupal and fell in love with the community. Today she is determined to collaborate with the community and help others to get involved.</p><p>&nbsp;</p>'
