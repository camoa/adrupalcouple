        uuid: 769c2eed-611d-4f48-b0c4-0ac1646e5aab
        entity_type: block_content
        bundle: basic
        base_fields:
          info: 'About origin narrative'
          reusable: false
          langcode: en
          block_revision_id: '10'
          enforce_new_revision: true
        custom_fields:
          body:
            -
              value: '<h2 class="font-heading text-3xl font-semibold">How this started</h2><p>Carlos has been around technology since 1987 and in the Drupal community since 2012, a champion of open source since 1996. He worked for years as a front-end developer, then as a Technical Account Manager, and now as a Drupal Advisor who connects people and advises on web development and Drupal best practices.</p><p>Ana came from the art and design world and challenged herself to learn code. She picked up Drupal quickly and fell in love with the community, and today she works as a senior web developer who is determined to collaborate and help others get involved.</p><p>We met working in Drupal and kept finding the same thing worth writing down: the honest version of what actually survives production. So we started writing it, in two voices, from both worlds. Is that the kind of writing you have been looking for?</p>'
              summary: null
              format: full_html
              embed_entities: {  }
