                    custom_fields:
                      body:
                        -
                          value: '<h2>Short Bio</h2><p>A friendly guy and adventurous Technical Account Manager who is passionate about traveling and living. If you have met Carlos you know he is a loyal friend and dedicated husband. He always puts family and friends first trying to make everyone feel good. He is fast learner and quick pivoting guy. Two of the qualities that make him a good TAM (connector) advising his clients in Web Development and Drupal best practices. He has been involved in technology since 1987 and the Drupal Community since 2012. A champion of open source since 1996.</p>'
