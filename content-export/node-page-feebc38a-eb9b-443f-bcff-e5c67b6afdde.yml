                body:
                  -
                    value: '<h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:Figtree, sans-serif;font-size:2rem;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.2;margin:0px 0px 0.5rem;orphans:2;padding:0px;scroll-behavior:smooth;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Who are we</h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:Figtree, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:26px;margin:0px 0px 1rem;orphans:2;padding:0px;scroll-behavior:smooth;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:break-spaces;widows:2;word-spacing:0px;"><a style="background-color:transparent;box-sizing:border-box;color:rgba(var(--bs-link-color-rgb), var(--bs-link-opacity, 1));margin:0px;padding:0px;scroll-behavior:smooth;text-decoration:none;" href="/anilu" rel="nofollow">Anilu</a> is a senior web developer, and a community advocate and mentor.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:Figtree, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:26px;margin:0px 0px 1rem;orphans:2;padding:0px;scroll-behavior:smooth;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:break-spaces;widows:2;word-spacing:0px;">&nbsp;</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:Figtree, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:26px;margin:0px 0px 1rem;orphans:2;padding:0px;scroll-behavior:smooth;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:break-spaces;widows:2;word-spacing:0px;"><a style="background-color:transparent;box-sizing:border-box;color:rgba(var(--bs-link-color-rgb), var(--bs-link-opacity, 1));margin:0px;padding:0px;scroll-behavior:smooth;text-decoration:none;" href="/camoa" rel="nofollow">Carlos</a> has worked in Drupal for over 10 years, first as a Front-End developer and the last years as a TAM, now a Drupal Advisor.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:Figtree, sans-serif;font-size:2rem;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.2;margin:0px 0px 0.5rem;orphans:2;padding:0px;scroll-behavior:smooth;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Our story</h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:Figtree, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:26px;margin:0px 0px 1rem;orphans:2;padding:0px;scroll-behavior:smooth;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:break-spaces;widows:2;word-spacing:0px;">We met while working in Drupal and found a common interest in the community. ... Eventually we fell in love. (more to come)&nbsp;</p>'
                    summary: ''
                    format: full_html
                    embed_entities: {  }
                field_community_story:
                  -
                    value: '<p>None of this stayed between the two of us. We took it into the community, because someone made room for us once and we try to do the same. Carlos keeps contributing and mentoring in the core rooms, Ana works alongside first-time contributors, and we keep publishing in the open where anyone can check our work.</p>'
                    format: full_html
                    embed_entities: {  }
                field_couple:
                  -
