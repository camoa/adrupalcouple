custom_fields:
  body:
    -
      value: "<p>About ADrupalCouple</p><p>Welcome to ADrupalCouple, a space where partners who live, love, and work together in the Drupal ecosystem share their unique perspectives and experiences.</p><h2>Our Vision</h2><p>We believe that couples who work together in Drupal bring something special to our community - the ability to see challenges and opportunities from complementary perspectives. Whether it's tackling technical problems, contributing to the community, or navigating work-life balance, each partner brings their own viewpoint while sharing a common passion for Drupal.</p><h2>What We Share</h2><p>Here you'll find stories, insights, and experiences from partners who:</p><ul><li>Collaborate on Drupal projects while maintaining healthy relationships</li><li>Navigate the challenges and joys of sharing both personal and professional spaces</li><li>Bring different skills and perspectives to their work</li><li>Contribute to the Drupal community as individuals and couples</li></ul><h2>Join Us</h2><p>Are you part of a couple working together in Drupal? We welcome your voices and stories. This platform is a space for sharing experiences, whether through individual perspectives or joint narratives. Your stories can help others understand the unique dynamics of partnering in both life and Drupal.</p><h2>About the Founders</h2><p>ADrupalCouple was created by Carlos (Camoa) and Ana Laura (Anilu), who experienced firsthand the value of sharing both individual and coupled perspectives in the Drupal community. From different technical backgrounds and approaches, we found that our complementary viewpoints enriched both our work and the community.</p>"
      summary: 'We met while working in Drupal and found a common interest in the community. ... Eventually we fell in love. '
      format: basic_html
      embed_entities: {  }
