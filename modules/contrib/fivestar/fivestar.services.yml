services:
  fivestar.widget_manager:
    class: \Drupal\fivestar\WidgetManager
    autowire: true
  Drupal\fivestar\WidgetManagerInterface: '@fivestar.widget_manager'

  fivestar.vote_manager:
    class: \Drupal\fivestar\VoteManager
    autowire: true
  Drupal\fivestar\VoteManagerInterface: '@fivestar.vote_manager'

  fivestar.vote_result_manager:
    class: \Drupal\fivestar\VoteResultManager
    autowire: true
  Drupal\fivestar\VoteResultManagerInterface: '@fivestar.vote_result_manager'

  Drupal\fivestar\Hook\FivestarFormHooks:
    class: \Drupal\fivestar\Hook\FivestarFormHooks
    autowire: true
  Drupal\fivestar\Hook\FivestarFivestarHooks:
    class: \Drupal\fivestar\Hook\FivestarFivestarHooks
    autowire: true
  Drupal\fivestar\Hook\FivestarHelpHooks:
    class: \Drupal\fivestar\Hook\FivestarHelpHooks
    autowire: true
  Drupal\fivestar\Hook\FivestarRenderHooks:
    class: \Drupal\fivestar\Hook\FivestarRenderHooks
    autowire: true
