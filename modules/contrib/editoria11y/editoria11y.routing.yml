editoria11y.settings:
  path: '/admin/config/content/editoria11y'
  defaults:
    _form: '\Drupal\editoria11y\Form\Editoria11ySettings'
    _title: 'Editoria11y core settings'
  requirements:
    _permission: 'administer editoria11y checker'

editoria11y.demo:
  path: '/admin/config/content/editoria11y/demo'
  defaults:
    _controller: '\Drupal\editoria11y\Controller\DemoController::demo'
    _title: 'Demo'
  requirements:
    _permission: 'administer editoria11y checker'

editoria11y.reports_dashboard:
  path: '/admin/reports/editoria11y'
  defaults:
    _controller: '\Drupal\editoria11y\Controller\DashboardController::dashboard'
    _title: 'Content Accessibility Issues'
  requirements:
    _permission: 'manage editoria11y results'

editoria11y.csv_export:
  path: '/admin/reports/editoria11y/export-csv/{view_id}/{display_id}'
  defaults:
    _controller: '\Drupal\editoria11y\Controller\CsvExportController::export'
    _title: 'Export CSV'
  methods: [GET]
  requirements:
    _permission: 'manage editoria11y results'
    view_id: '[a-z0-9_]+'
    display_id: '[a-z0-9_]+'
  options:
    no_cache: true

editoria11y.api_config:
  path: '/editoria11y/api/config'
  defaults:
    _controller: '\Drupal\editoria11y\Controller\Ed11yConfigController::getConfig'
  requirements:
    _permission: 'view editoria11y checker'

editoria11y.api_report:
  path: '/editoria11y/api/results/report'
  defaults:
    _controller: '\Drupal\editoria11y\Controller\ApiController::report'
  methods: [POST]
  requirements:
    _permission: 'view editoria11y checker'
    _user_is_logged_in: 'TRUE'
    _content_type_format: 'json'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: true

editoria11y.api_dismiss:
  path: '/editoria11y/api/dismiss'
  defaults:
    _controller: '\Drupal\editoria11y\Controller\ApiController::dismiss'
  methods: [POST]
  requirements:
    _permission: 'view editoria11y checker'
    _user_is_logged_in: 'TRUE'
    _content_type_format: 'json'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: true

editoria11y.api_purge_page:
  path: '/editoria11y/api/purge/page'
  methods: [POST]
  defaults:
    _controller: '\Drupal\editoria11y\Controller\ApiController::purgePage'
  requirements:
    _permission: 'manage editoria11y results'
    _user_is_logged_in: 'TRUE'
    _content_type_format: 'json'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: true

editoria11y.api_purge_dismissals:
  path: '/editoria11y/api/purge/dismissal'
  methods: [POST]
  defaults:
    _controller: '\Drupal\editoria11y\Controller\ApiController::purgeDismissals'
  requirements:
    _permission: 'manage editoria11y results'
    _user_is_logged_in: 'TRUE'
    _content_type_format: 'json'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: true
