name: 'ADrupalCouple Tier1 Sections'
description: >
  Provides three Layout Builder inline-block bundles for the Home and About
  compositional pages: `masthead` (Home §1 compact masthead), `couple_hero`
  (About §1 dual-face + lede block), and `couple_story_block` (About §3
  community-arc block referencing the couple entity via couple_story view mode).
  Reconciles the Q-01 contradiction — the data-model intentionally omitted
  adrupalcouple_tier1_sections, but Q-01 is locked to LB inline-blocks for
  Home/About (matrix-default D ownership per data-model §12.1/§12.2).
  Apply after adrupalcouple_foundation (provides node entity types + language.entity.es).
type: 'Content type'
config:
  # strict: false — bundles do not yet exist on live, but allow re-application
  # without fatal errors once they do (idempotent runs).
  strict: false
