name: 'ADrupalCouple Tier2 Article'
description: 'Provides field instances on the article node bundle: schema_image, field_illustrative, field_closing_question.'
type: 'Content type'
config:
  # strict: false — fields may already exist on live (schema_image pre-dates recipe; illustrative
  # + closing_question added via g_content_model_fields task). Config files provide canonical
  # state for fresh installs; actions update existing instances.
  strict: false
  actions:
    field.field.node.article.schema_image:
      entity_method:field.field:setLabel: 'Hero image'
      entity_method:field.field:setDescription: 'Used as card thumbnail and og:image. Never displayed on the article page itself.'
      entity_method:field.field:setRequired: false
    field.field.node.article.field_illustrative:
      entity_method:field.field:setLabel: 'Illustrative / placeholder'
      entity_method:field.field:setDescription: 'Marks placeholder/illustrative articles. Excluded from Home, Writing, and Tag listing Views.'
    field.field.node.article.field_closing_question:
      entity_method:field.field:setLabel: 'Closing question'
      entity_method:field.field:setDescription: 'The InvitationClose closing question. Optional; degrades to body prose if empty.'
