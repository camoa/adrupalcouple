name: 'ADrupalCouple Tier2 Couple'
description: 'Provides schema_image field instance, field_milestone compound custom_field, field_founding boolean, and couples_grid View updates on the couple node bundle.'
type: 'Content type'
config:
  # strict: false — field.field.node.couple.schema_image already exists on live;
  # field_milestone is NET-NEW (shipped as config files).
  strict: false
  actions:
    field.field.node.couple.schema_image:
      entity_method:field.field:setLabel: 'Couple portrait'
    # Edit form: place field_milestone widget + regroup into field_group_tabs
    # (Story | The Pairing | Milestones) per task §2.2.
    core.entity_form_display.node.couple.default:
      setProperties:
        content.field_milestone:
          type: custom_stacked
          weight: 10
          region: content
          settings: { label: true, wrapper: div, open: true }
          third_party_settings: {  }
        content.field_community_story:
          type: text_textarea
          weight: 5
          region: content
          settings: { rows: 8, placeholder: 'Community-arc narrative prose for About §3 (CoupleStory). EN text here; add ES translation separately.' }
          third_party_settings: {  }
        third_party_settings.field_group:
          group_tabs:
            children: [group_story, group_pairing, group_milestones]
            label: 'Couple'
            parent_name: ''
            region: content
            weight: -10
            format_type: tabs
            format_settings: { direction: horizontal }
          group_story:
            children: [title, body, field_community_story, schema_image]
            label: 'Story'
            parent_name: group_tabs
            region: content
            weight: 0
            format_type: tab
            format_settings: { formatter: open }
          group_pairing:
            children: [field_couple]
            label: 'The Pairing'
            parent_name: group_tabs
            region: content
            weight: 1
            format_type: tab
            format_settings: { formatter: closed }
          group_milestones:
            children: [field_milestone]
            label: 'Milestones'
            parent_name: group_tabs
            region: content
            weight: 2
            format_type: tab
            format_settings: { formatter: closed }

    # --- View display: teaser (couples_grid card) ---
    core.entity_view_display.node.couple.teaser:
      setProperties:
        third_party_settings:
          layout_builder: { enabled: false, allow_custom: false }
        content:
          schema_image:
            type: entity_reference_entity_view
            label: hidden
            settings: { view_mode: adc_card_thumbnail, link: false }
            third_party_settings: {  }
            weight: 0
            region: content
          title:
            type: title
            label: hidden
            settings: { link_to_entity: true, tag: h2 }
            third_party_settings: {  }
            weight: 1
            region: content
          body:
            type: text_summary_or_trimmed
            label: hidden
            settings: { trim_length: 160 }
            third_party_settings: {  }
            weight: 2
            region: content
          field_couple:
            type: entity_reference_entity_view
            label: hidden
            settings: { view_mode: token, link: false }
            third_party_settings: {  }
            weight: 3
            region: content
        hidden:
          created: true
          field_community_story: true
          field_milestone: true
          langcode: true
          links: true
          node_read_time: true
          uid: true

    # --- View display: default ---
    core.entity_view_display.node.couple.default:
      setProperties:
        content:
          title:
            type: title
            label: hidden
            settings: { link_to_entity: true, tag: h2 }
            third_party_settings: {  }
            weight: 0
            region: content
          schema_image:
            type: entity_reference_entity_view
            label: hidden
            settings: { view_mode: adc_card_thumbnail, link: false }
            third_party_settings: {  }
            weight: 1
            region: content
          body:
            type: text_summary_or_trimmed
            label: hidden
            settings: { trim_length: 200 }
            third_party_settings: {  }
            weight: 2
            region: content
          field_couple:
            type: entity_reference_entity_view
            label: hidden
            settings: { view_mode: token, link: false }
            third_party_settings: {  }
            weight: 3
            region: content
        hidden:
          created: true
          field_community_story: true
          field_milestone: true
          langcode: true
          links: true
          node_read_time: true
          uid: true

    # --- View display: full_article (couple profile; LB not used → template
    #     node--couple--full-article.html.twig owns layout). field_couple renders
    #     person:token atoms; field_milestone wired to ui_suite_daisyui:timeline_item. ---
    core.entity_view_display.node.couple.full_article:
      setProperties:
        third_party_settings:
          layout_builder: { enabled: false, allow_custom: false }
        content: &couple_profile_content
          field_couple:
            type: entity_reference_entity_view
            label: hidden
            settings: { view_mode: token, link: false }
            third_party_settings: {  }
            weight: 0
            region: content
          body:
            type: text_default
            label: hidden
            settings: {  }
            third_party_settings: {  }
            weight: 1
            region: content
          field_milestone:
            type: ui_patterns_component_per_item
            label: hidden
            settings:
              ui_patterns:
                component_id: 'ui_suite_daisyui:timeline_item'
                props: {  }
                slots:
                  timeline_start:
                    sources:
                      - source_id: 'field_property:node:field_milestone:year'
                        source: {  }
                  timeline_end:
                    sources:
                      - source_id: 'field_property:node:field_milestone:label'
                        source: {  }
            third_party_settings: {  }
            weight: 2
            region: content
        hidden: &couple_profile_hidden
          created: true
          field_community_story: true
          links: true
          langcode: true
          node_read_time: true
          schema_image: true
          title: true
          uid: true

    # --- View display: full (mirrors full_article via theme suggestion; task §1.2.4) ---
    core.entity_view_display.node.couple.full:
      setProperties:
        third_party_settings:
          layout_builder: { enabled: false, allow_custom: false }
        content: *couple_profile_content
        hidden: *couple_profile_hidden

    # --- couples_grid View: page_couples task updates ---
    # Canonical View ID: couples_grid (data-model.md §1 — task.md used couples_index, which
    # is incorrect; actual installed config is views.view.couples_grid).
    #
    # Changes applied:
    # - style: grid_responsive → unformatted (custom Twig provides grid wrapper)
    # - pager: mini → none (show all couples)
    # - sorts: created DESC → field_founding DESC + title ASC
    # - page_1 path: couples-grid → couples
    # - block_1 display added for LB embed (alternative approach)
    #
    # NOTE: field_founding (boolean) is imported by this recipe's config/ files above;
    # it must exist before the View sort referencing node__field_founding.field_founding_value
    # is applied. Recipe config import precedes config.actions, so ordering is safe.
    views.view.couples_grid:
      setProperties:
        display.default.display_options.style:
          type: default
          options: {}
        display.default.display_options.pager:
          type: none
          options:
            offset: 0
        display.default.display_options.sorts:
          field_founding_value:
            id: field_founding_value
            table: node__field_founding
            field: field_founding_value
            relationship: none
            group_type: group
            admin_label: ''
            entity_type: node
            entity_field: field_founding
            plugin_id: standard
            order: DESC
            expose:
              label: ''
              field_identifier: ''
            exposed: false
          title:
            id: title
            table: node_field_data
            field: title
            relationship: none
            group_type: group
            admin_label: ''
            entity_type: node
            entity_field: title
            plugin_id: standard
            order: ASC
            expose:
              label: ''
              field_identifier: ''
            exposed: false
        display.page_1.display_options.path: couples
        display.page_1.display_options.menu:
          type: normal
          title: Couples
          description: ''
          weight: -49
          expanded: false
          menu_name: main
          parent: ''
          context: '0'
        display.block_1:
          id: block_1
          display_title: 'Block (LB embed)'
          display_plugin: block
          position: 2
          display_options:
            display_extenders: {}
            block_description: 'Couples grid'
            block_hide_empty: false
            block_category: 'Lists (Views)'
            allow_settings:
              use_pager: false
              offset: false
              items_per_page: false
              hide_empty: false
              link_to_view: false
              more_link: false
              path_override: false
              title: false
              fields_override: false
          cache_metadata:
            max-age: -1
            contexts:
              - 'languages:language_content'
              - 'languages:language_interface'
              - url.query_args
              - 'user.node_grants:view'
              - user.permissions
            tags: {}
