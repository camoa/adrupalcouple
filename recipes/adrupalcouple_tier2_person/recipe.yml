            third_party_settings: {  }
            weight: 1
            region: content
          schema_family_name:
            type: string
            label: hidden
            settings: { link_to_entity: false }
            third_party_settings: {  }
            weight: 2
            region: content
          field_role:
            type: string
            label: hidden
            settings: { link_to_entity: false }
            third_party_settings: {  }
            weight: 3
            region: content
        hidden:
          body: true
          content_moderation_control: true
          created: true
          field_author_focus: true
          field_metatag: true
          field_tags: true
          langcode: true
          links: true
          node_read_time: true
          schema_additional_name: true
          schema_birth_date: true
          schema_email: true
          schema_knows_language: true
          schema_member_of: true
          schema_same_as: true
          schema_subject_of: true
          schema_telephone: true
          schema_works_for: true
          title: true
