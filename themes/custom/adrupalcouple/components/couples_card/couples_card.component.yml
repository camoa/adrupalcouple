$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Couples Card
status: stable
description: >
  A couple entry in the Couples listing grid. DaisyUI card primitive with:
  an overlapping avatar pair (2 persons from field_couple), the couple name as
  a linked h3.card-title, an optional founding badge, and a story excerpt.
  Used exclusively in the couples_grid View (teaser row rendering).
  React reference: CouplesCard.tsx + Avatar.tsx.
group: adrupalcouple
props:
  type: object
  required:
    - couple_name
    - couple_url
    - story_excerpt
  properties:
    couple_name:
      type: string
      title: 'Couple display name'
      description: 'The couple title node field. Rendered as h3.card-title > a.link.link-hover.'
    couple_url:
      type: string
      title: 'Couple profile URL'
      description: 'Pre-resolved URL to the couple node canonical page (path alias /couples/{slug}).'
    story_excerpt:
      type: string
      title: 'Story excerpt'
      description: 'body.summary or first ~160 chars of body.value (strip_tags applied). Rendered as p.text-sm.text-muted.'
    founding:
      type: boolean
      title: 'Founding couple flag'
      description: 'When true, renders the founding badge (badge-secondary badge-sm).'
    founding_label:
      type: string
      title: 'Founding badge label'
      description: 'Translated label text for the founding badge. EN: "Founding couple", ES: "Pareja fundadora".'
    couple_persons:
      type: array
      title: 'Person face data'
      description: 'Up to 2 persons from field_couple. Each item has name, avatar_url, initials.'
      items:
        type: object
        properties:
          name:
            type: string
            title: 'Person display name'
            description: 'Used as img alt text and sr-only text for initials fallback.'
          avatar_url:
            type: string
            title: 'Avatar image URL'
            description: 'Pre-built URL from adc_couple_faces_1x1_128 image style (128×128px WebP). Empty string triggers initials fallback.'
          initials:
            type: string
            title: 'Initials fallback'
            description: 'First letter of first and last name, uppercase (e.g. "CO"). Used when avatar_url is empty.'
    modifier_class:
      type: string
      title: 'Extra CSS class'
      description: 'Additional utility classes appended to the article root. Optional.'
libraryOverrides:
  dependencies:
    - core/drupal
