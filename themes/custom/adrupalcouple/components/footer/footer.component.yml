$schema: https://git.drupalcode.org/project/sdc/-/raw/1.x/src/metadata.schema.json
name: Footer
status: experimental
props:
  type: object
  required:
    - brand_name
    - rights_text
    - built_note
    - writing_nav_label
    - about_nav_label
  properties:
    brand_name:
      type: string
      title: Brand name
      examples:
        - "A Drupal Couple"
    rights_text:
      type: string
      title: Rights text
      examples:
        - "All rights reserved."
    built_note:
      type: string
      title: Built note
      examples:
        - "Built with Drupal, love, and open source."
    writing_nav_label:
      type: string
      title: Writing navigation label
      description: Used as aria-label on the Writing nav AND as the visible footer-title h2.
      examples:
        - "Writing"
    about_nav_label:
      type: string
      title: About navigation label
      description: Used as aria-label on the About nav AND as the visible footer-title h2.
      examples:
        - "About"
    additional_classes:
      type: string
      title: Additional CSS classes
      default: ''
slots:
  writing_links:
    title: Writing links
    description: >
      Rendered link items for the Writing navigation group. Each <a> must carry
      classes "link link-hover". Sourced from the Drupal "footer_writing" menu.
  about_links:
    title: About links
    description: >
      Rendered link items for the About navigation group. Each <a> must carry
      classes "link link-hover". Must include the /accessibility link (§14.3 required).
      Sourced from the Drupal "footer_about" menu.
libraryOverrides:
  dependencies:
    - adrupalcouple/daisyui
